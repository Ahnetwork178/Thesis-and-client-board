<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thesis Client Control Board</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1d2a2a;--mut:#667070;--line:#d9d5cb;--red:#c8372d;--org:#d9822b;--yel:#b8a21a;--gry:#8a8f8f;--grn:#2f8f5b;--acc:#16403f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1a;--card:#1b2626;--ink:#e8eeee;--mut:#9aa8a8;--line:#2e3d3d;--acc:#6fc2bd}}
:root[data-theme="dark"]{--bg:#121a1a;--card:#1b2626;--ink:#e8eeee;--mut:#9aa8a8;--line:#2e3d3d;--acc:#6fc2bd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Georgia,"Times New Roman",serif}
.w{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 2px}h2{font-size:17px;margin:0 0 8px}
.sub{color:var(--mut);font-family:system-ui,sans-serif;font-size:13px}
.sans,button,input,select,textarea{font-family:system-ui,sans-serif}
.alarm{background:var(--card);border:2px solid var(--red);border-radius:6px;padding:12px;margin:14px 0}
.alarm.ok{border-color:var(--grn)}
.alarm li{margin:3px 0;font-family:system-ui,sans-serif;font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.st{flex:1 1 110px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:system-ui,sans-serif}
.st b{display:block;font-size:22px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 11px;font-size:14px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme="dark"] button.p{color:#0b1414}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#0b1414}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--org);outline-offset:1px}
input,select,textarea{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:7px;font-size:14px;width:100%}
.bar input,.bar select{width:auto}
.c{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--gry);border-radius:6px;padding:10px 12px;margin:8px 0}
.c.RED{border-left-color:var(--red)}.c.ORG{border-left-color:var(--org)}.c.YEL{border-left-color:var(--yel)}.c.GRN{border-left-color:var(--grn)}.c.HOLD{border-left-color:var(--gry);opacity:.85}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nm{font-weight:bold;font-size:16px}.tp{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-family:system-ui,sans-serif;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:1px 8px;margin:2px 3px 2px 0}
.tag.r{border-color:var(--red);color:var(--red)}.tag.g{border-color:var(--grn);color:var(--grn)}.tag.o{border-color:var(--org);color:var(--org)}
.prog{height:6px;background:var(--line);border-radius:3px;margin:8px 0;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:460px;width:94%;padding:16px}
dialog{max-height:92vh;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.5)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f label{font-family:system-ui,sans-serif;font-size:12px;color:var(--mut)}.f .full{grid-column:1/-1}
input:disabled{opacity:.45}@media print{.w{display:none!important}#rc{display:block!important;position:static;border:0;color:#000;background:#fff;max-width:100%}.nop{display:none!important}}
.empty{padding:26px;text-align:center;color:var(--mut)}
</style></head><body><div class="w">
<h1>Thesis Client Control Board</h1>
<div class="sub" id="today"></div>
<div id="alarm"></div><div id="top3"></div><div id="tgt"></div>
<div class="stats" id="stats"></div>
<div class="bar">
<button class="p" onclick="openForm()">Add client</button>
<select id="fl" onchange="render()"><option value="all">All clients</option><option value="active">Active only</option><option value="hold">Supervisor hold</option><option value="paid">Paid in full</option><option value="unpaid">Owing money</option><option value="done">Delivered</option></select>
<input id="q" placeholder="Search name or topic" oninput="render()">
<button onclick="exp()">Backup</button><button onclick="document.getElementById('imp').click()">Restore</button>
<input type="file" id="imp" accept=".json" style="display:none" onchange="imp(this)"><button onclick="sopen()">Settings</button><button onclick="pull()">Pull from cloud</button><button onclick="newSess()">Start new session</button><button onclick="openArc()">Archive</button><button onclick="ppl()">Price list</button><button onclick="stmt()">Account statement</button><button onclick="ohEdit()">Overheads</button><span class="sub" id="sync"></span>
</div>
<div id="list"></div>
<dialog id="dg"><form method="dialog" onsubmit="return false"><h2 id="dt">Client</h2><div class="f">
<div class="full"><label>Client name</label><input id="n"></div>
<div class="full"><label>Thesis topic</label><input id="t"></div>
<div><label>Job type</label><select id="jt" onchange="pf()"><option value="I">Individual</option><option value="G">Group (4 or more)</option><option value="S">Supervisor deal</option></select></div><div><label>Level</label><select id="lv" onchange="fs()"><option>ND</option><option>HND</option><option>BSc</option><option>B.Ed</option><option>PED</option><option>MSc</option><option>PhD</option></select></div><div><label>Current stage</label><select id="s"></select></div>
<div><label>Lane</label><select id="l"><option value="A">Active</option><option value="H">Supervisor hold</option></select></div>
<div><label>Defense date</label><input type="date" id="d"></div>
<div><label>Fee agreed (₦) <span id="fh"></span></label><input type="number" id="fe" oninput="pf()"></div>
<div><label>Amount paid (₦)</label><input type="number" id="pd" oninput="pf()"></div><div id="plw"><label>Plagiarism cost (₦) <span id="plh"></span></label><input type="number" id="pl"><select id="pa" onchange="$('pl').value=this.value"><option value="">Add-on price list</option><option value="6000">Turnitin report 6,000</option><option value="15000">Turnitin check + rework 15,000</option><option value="10000">DrillBit report 10,000</option><option value="25000">DrillBit check + rework 25,000</option></select></div>
<div><label>Phone</label><input id="ph"></div>
<div><label>Preliminary pages by writer (₦20,000)</label><select id="pw"><option value="">No</option><option value="1">Yes</option></select></div><div><label>Pages</label><input type="number" id="pg"></div><div><label>Hardcover copies</label><input type="number" id="cp"></div><div><label>Cover colour</label><input id="cv"></div><div><label>Expenses on this job (₦)</label><input type="number" id="ex"></div><div><label>Contact client again on</label><input type="date" id="fu"></div><div><label>Delivered and confirmed?</label><select id="cf"><option value="">No</option><option value="1">Yes</option></select></div><div class="full"><label>What is pending / reason for delay (included in WhatsApp update)</label><textarea id="nt" rows="2"></textarea></div>
</div><div class="bar"><button class="p" onclick="save()">Save</button><button onclick="dg.close()">Cancel</button><button id="del" onclick="rm()" style="margin-left:auto;color:var(--red)">Delete</button></div></form></dialog>
<dialog id="ad"><h2>Archive of past sessions</h2><div id="ab"></div><div class="bar"><button onclick="$('ad').close()">Close</button></div></dialog>
<dialog id="pbd"><h2>2027 price list</h2><div id="pbb"></div><div class="bar"><button class="p" onclick="pbe()">Edit prices</button><button onclick="$('pbd').close()">Close</button></div></dialog>
<dialog id="wmd"><h2>Send on WhatsApp</h2><div id="wmb"></div><div class="bar"><button onclick="$('wmd').close()">Cancel</button></div></dialog>
<dialog id="pbe"><h2>Edit price list</h2><div id="pbeb"></div><div class="bar"><button class="p" onclick="pbs()">Save prices</button><button onclick="pbr()">Reset to report</button><button onclick="$('pbe').close()">Cancel</button></div></dialog>
<dialog id="ohg"><h2>One-time overheads</h2><div id="ohb"></div><div class="bar"><button onclick="ohAdd()">Add cost</button><button class="p" onclick="ohSave()">Save</button><button onclick="$('ohg').close()">Cancel</button></div></dialog>
<dialog id="sd"><h2>Settings</h2><div class="f"><div class="full"><label>Business name (shown on receipts)</label><input id="sb"></div><div><label>Minimum deposit %</label><input type="number" id="sp"></div><div><label>Correction rounds allowed</label><input type="number" id="scl"></div><div><label>Net profit target (₦)</label><input type="number" id="stg"></div><div><label>Transport days so far</label><input type="number" id="std"></div><div><label>Target counts clients quoted from</label><input type="date" id="sts"></div><div><label>Ream price (₦)</label><input type="number" id="srm"></div><div><label>Print rate per page (₦)</label><input type="number" id="spr"></div><div><label>Photocopy fee per page (₦)</label><input type="number" id="spc"></div><div><label>Hardcover per 2 copies (₦)</label><input type="number" id="shc"></div><div><label>Disc per 2 copies (₦)</label><input type="number" id="sdc"></div><div><label>Paper stock (reams)</label><input type="number" id="sps"></div><div><label>Opening bank balance (₦)</label><input type="number" id="sob"></div><div><label>Max active jobs</label><input type="number" id="scap"></div><div><label>Collection reminder every (days)</label><input type="number" id="sri"></div><div class="full"><label>Cloud sync URL (optional)</label><input id="su" placeholder="https://script.google.com/macros/s/.../exec"></div></div><div class="bar"><button class="p" onclick="ssave()">Save</button><button onclick="$('sd').close()">Close</button></div></dialog>
<script>
var ST=["Ch 1-3 (awaiting supervisor)","Ch 4","Ch 5","Abstract","References","Consolidation","Preliminary pages","Corrections","Final PDF","Soft spiral bind","Defense","Defense corrections","Plagiarism test","Hardcover bind","Delivered"];
var NEAR=3,KEY="thesisBoard1",D=[],eid=null,dg=document.getElementById("dg");
function ld(){try{D=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){D=[]}try{A=JSON.parse(localStorage.getItem("thesisArc1"))||[]}catch(e){A=[]}}
function mig(L){var M=[0,1,2,3,4,5,12,7,6,8,9,10,11,13,14];L.forEach(function(c){if(c.sg!==2){if(M[c.s]!==undefined)c.s=M[c.s];c.sg=2}})}
function mg(){mig(D);mig(A)}
function sv(){REV=Date.now();try{localStorage.setItem(KEY,JSON.stringify(D));localStorage.setItem("thesisRev1",REV)}catch(e){}push()}
var REV=0,BN="A-H NETWORKS COMPUTERS TECH",A=[],CF={dep:60,biz:BN,url:"",cl:2,tg:300000,td:0,ts:"2027-01-01",rm:4500,pr:60,pc:20,hc:3000,dc:3000,ps:2.5,ob:0,cap:12,ri:3,oh:[{n:"Shop rent",a:18000,d:""},{n:"Electricity",a:10000,d:""}]},tmr;
function sa(){try{localStorage.setItem("thesisArc1",JSON.stringify(A))}catch(e){}}
function newSess(){var done=D.filter(function(c){return c.s>=14&&owe(c)===0}),keep=D.length-done.length;
 if(!done.length){alert("No client is both delivered and fully paid yet, so nothing can be archived.");return}
 var col=done.reduce(function(a,c){return a+(+c.pd||0)},0),ex=done.reduce(function(a,c){return a+(+c.ex||0)},0);
 if(!confirm("Start a new session?\n\n"+done.length+" delivered and fully paid clients will move to the archive.\nCollected: "+N(col)+"\nExpenses: "+N(ex)+"\nNet profit: "+N(col-ex)+"\n\n"+keep+" clients stay on the board (not delivered or still owing).\n\nA backup file will download first."))return;
 exp();var ts=Date.now();done.forEach(function(c){c.ar=ts;A.push(c)});D=D.filter(function(c){return !(c.s>=14&&owe(c)===0)});sa();sv();render()}
function openArc(){var q=A.slice().sort(function(a,b){return b.ar-a.ar});
 var tc=A.reduce(function(s,c){return s+(+c.pd||0)},0),te=A.reduce(function(s,c){return s+(+c.ex||0)},0);
 $("ab").innerHTML='<p class="sub">'+A.length+' archived · collected '+N(tc)+' · expenses '+N(te)+' · net '+N(tc-te)+'</p>'+(q.length?q.map(function(c){return'<div class="c GRN"><div class="nm">'+esc(c.n)+'</div><div class="tp">'+esc(c.t||"")+'</div><div class="sans" style="font-size:13px">'+esc(c.lv||"ND")+' · archived '+new Date(c.ar).toDateString()+' · paid '+N(c.pd||0)+'</div><div class="acts" style="margin-top:6px"><button onclick="unarc(\''+c.id+'\')">Restore to board</button></div></div>'}).join(""):'<div class="empty">Nothing archived yet.</div>');
 $("ad").showModal()}
function unarc(id){var c=A.filter(function(x){return x.id===id})[0];A=A.filter(function(x){return x.id!==id});delete c.ar;D.push(c);sa();sv();render();openArc()}
function cfl(){try{REV=+localStorage.getItem("thesisRev1")||0}catch(e){}try{CF=Object.assign(CF,JSON.parse(localStorage.getItem("thesisCfg1")))}catch(e){}}
function msg(t){$("sync").textContent=t}
function push(){if(!CF.url)return;if(!D.length&&!A.length){msg("Not synced: board is empty");return}clearTimeout(tmr);tmr=setTimeout(function(){msg("Syncing...");fetch(CF.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({clients:D,archive:A,rev:REV,pb:PBK,xp:XP})}).then(function(){msg("Cloud saved "+new Date().toLocaleTimeString())}).catch(function(){msg("Cloud sync failed")})},1500)}
function pull(){if(!CF.url){alert("Add your cloud sync URL in Settings first.");return}
 fetch(CF.url).then(function(r){return r.json()}).then(function(j){var cl=Array.isArray(j)?j:(j.clients||null);if(cl&&confirm("Replace the data on this device with cloud data ("+cl.length+" clients)?")){D=cl;if(!Array.isArray(j)){A=j.archive||[];REV=+j.rev||0;if(j.pb){PBK=j.pb;XP=Object.assign(XP,j.xp||{});spb()}sa();try{localStorage.setItem("thesisRev1",REV)}catch(e){}}try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}render();msg("Pulled from cloud")}}).catch(function(){alert("Could not reach the cloud URL. Cloud sync works only from the downloaded file, not the claude.ai link.")})}
function sopen(){$("sb").value=CF.biz;$("sp").value=CF.dep;$("scl").value=CF.cl;$("stg").value=CF.tg;$("std").value=CF.td;$("sts").value=CF.ts;$("srm").value=CF.rm;$("spr").value=CF.pr;$("spc").value=CF.pc;$("shc").value=CF.hc;$("sdc").value=CF.dc;$("sps").value=CF.ps;$("sob").value=CF.ob;$("scap").value=CF.cap;$("sri").value=CF.ri;$("su").value=CF.url;$("sd").showModal()}
function ssave(){CF.biz=$("sb").value;CF.dep=+$("sp").value||60;CF.cl=+$("scl").value||2;CF.tg=+$("stg").value||300000;CF.td=+$("std").value||0;CF.ts=$("sts").value||"2027-01-01";CF.rm=+$("srm").value||4500;CF.pr=+$("spr").value||60;CF.pc=+$("spc").value||20;CF.hc=+$("shc").value||3000;CF.dc=+$("sdc").value||3000;CF.ps=+$("sps").value||0;CF.ob=+$("sob").value||0;CF.cap=+$("scap").value||12;CF.ri=+$("sri").value||3;CF.url=$("su").value.trim();try{localStorage.setItem("thesisCfg1",JSON.stringify(CF))}catch(e){}$("sd").close();render();chk()}
function chk(){if(!CF.url)return;msg("Checking cloud...");
 fetch(CF.url).then(function(r){return r.json()}).then(function(j){var cl=Array.isArray(j)?j:(j.clients||[]),ar=Array.isArray(j)?[]:(j.archive||[]),cr=Array.isArray(j)?0:(+j.rev||0),cn=cl.length+ar.length,ln=D.length+A.length;
  if(cn&&(!ln||cr>REV)){if(confirm("Cloud has "+cl.length+" clients"+(cr?" (saved "+new Date(cr).toLocaleString()+")":"")+". Load them onto this device?"+(ln?"\n\nThis will replace the "+D.length+" clients here.":""))){D=cl;A=ar;REV=cr;if(j&&j.pb){PBK=j.pb;XP=Object.assign(XP,j.xp||{});spb()}try{localStorage.setItem(KEY,JSON.stringify(D));localStorage.setItem("thesisRev1",REV)}catch(e){}sa();render();msg("Loaded from cloud");return}}
  if(ln&&(!cn||REV>cr)){push();return}
  msg("Cloud and this device match")}).catch(function(){msg("Could not reach cloud")})}
function exa(id){var c=g(id),v=prompt("Add a cost: category, then amount.\nCategories: writer, print, binding, disc, paper, transport, check, other\nExample: print 4200");if(!v)return;
 var m=/^([a-z]+)\s+([\d,]+)/i.exec(v.trim());if(!m){alert("Type the category, then the amount. Example: print 4200");return}
 var a=+m[2].replace(/,/g,"");(c.cl=c.cl||[]).push({k:m[1].toLowerCase(),a:a,t:Date.now()});c.ex=(+c.ex||0)+a;c.u=Date.now();sv();render()}
function rcpt(id){var c=g(id),L=c.pay||[],sm=L.reduce(function(a,x){return a+x.a},0),oth=(+c.pd||0)-sm;
 var rows=(oth>0?'<tr><td>Earlier payments</td><td>'+N(oth)+'</td></tr>':'')+L.map(function(x){return'<tr><td>'+new Date(x.t).toDateString()+(x.g?" (paper at cost)":"")+'</td><td>'+N(x.a)+'</td></tr>'}).join("");
 $("rcb").innerHTML='<h2>'+esc(CF.biz||BN)+'</h2><p>Received from: <b>'+esc(c.n)+'</b><br>Project: '+esc(c.t||"-")+'<br>Date: '+new Date().toDateString()+'</p><table style="width:100%;border-collapse:collapse" border="1" cellpadding="6"><tr><th align="left">Date</th><th align="left">Amount paid</th></tr>'+rows+'</table><p>Total fee: <b>'+N((+c.fe||0)+(c.lv==="ND"?0:(+c.pl||0)))+'</b><br>Total paid: <b>'+N(c.pd||0)+'</b><br>Balance: <b>'+N(owe(c))+'</b></p><p>Thank you for your patronage.</p>';
 $("rc").showModal()}
function $(i){return document.getElementById(i)}
function days(d){if(!d)return null;var a=new Date(d+"T00:00:00"),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/864e5)}
function ago(ts){return Math.floor((Date.now()-ts)/864e5)}
function cls(c){
 if(c.s>=14)return{k:"GRN",r:5,l:"Delivered"};
 if(c.l==="H")return{k:"HOLD",r:4,l:"Supervisor hold"};
 var d=days(c.d);
 if(d!==null&&d<=13&&c.s<10)return{k:"RED",r:1,l:"Defense critical"};
 if(c.s>=NEAR)return{k:"ORG",r:2,l:"Near complete"};
 return{k:"YEL",r:3,l:"Active, not defense-ready"}}
var PBK={ND:{I:[27000,18000,40000,31600],G:[24000,18000,37000,28300],S:[21000,18000,37000,28300]},HND:{I:[30000,18000,43000,34600],G:[27000,18000,40000,31300],S:[24000,18000,40000,31300]}};
var DEF=JSON.parse(JSON.stringify(PBK)),XPD={ec:6000,cc:4620,ep:400,lim:80,pw:20000},XP=Object.assign({},XPD);
function spb(){try{localStorage.setItem("thesisPB1",JSON.stringify({pb:PBK,xp:XP}))}catch(e){}}
function lpb(){try{var j=JSON.parse(localStorage.getItem("thesisPB1"));if(j){PBK=j.pb||PBK;XP=Object.assign(XP,j.xp)}}catch(e){}}
function cdel(c){var p=c.pg||70,k=c.cp||2;return Math.round(1.1*(p*k*(CF.rm-4500)/500+p*(CF.pr-60)+p*(k-1)*(CF.pc-20)+(k/2)*(CF.hc-3000)+(k/2)*(CF.dc-3000)))}
var JT={I:"Individual",G:"Group (4+)",S:"Supervisor deal"};
function PB(c){var t=PBK[c.lv||"ND"];if(!t)return null;var r=t[c.jt||"I"]||t.I;return{w:r[0],p:r[1],price:r[0]+r[1],floor:r[2],cost:r[3]}}
function xt(c){return(c.pg>XP.lim?(c.pg-XP.lim)*XP.ep:0)+(c.cp>2?(c.cp-2)*XP.ec:0)+(c.pw?XP.pw:0)}
function tot(c){return(+c.fe||0)+xt(c)+(c.lv==="ND"?0:(+c.pl||0))}
function owe(c){return Math.max(0,tot(c)-(+c.pd||0))}
function wfee(c){var b=PB(c);return b&&c.fe>=b.p?c.fe-b.p:(+c.fe||0)}
function flags(c){var b=PB(c),h="",x=xt(c),pd=+c.pd||0,wf=wfee(c);
 if(b&&c.fe>0&&c.fe<b.floor)h+='<span class="tag r">Below floor '+N(b.floor)+'</span>';
 if(x)h+='<span class="tag o">Extras '+N(x)+'</span>';
 if(c.s>=7&&c.s<14||c.cr){var r=c.cr||0;h+='<span class="tag '+(r>CF.cl?'r':'')+'">Correction rounds '+r+'/'+CF.cl+(r>CF.cl?': charge extra pages at '+N(XP.ep):'')+'</span>'}
 if(c.s>=5&&c.s<14&&pd<wf)h+='<span class="tag r">Hold the file: writing fee not cleared</span>';
 else if(c.s>=8&&c.s<14&&pd<(+c.fe||0)+x)h+='<span class="tag r">Collect production package before printing</span>';
 if(!pd&&c.qd&&ago(c.qd)>21&&c.s<14)h+='<span class="tag o">Quote older than 3 weeks: reprice</span>';
 if(b&&c.fe>0){var ct=b.cost+(c.cp>2?(c.cp-2)*XP.cc:0)+cdel(c);h+='<span class="tag">Est. margin '+N((+c.fe||0)+x-ct)+'</span>'}
 if(c.cl&&c.cl.length){var q={};c.cl.forEach(function(y){q[y.k]=(q[y.k]||0)+y.a});h+='<span class="tag">Costs: '+Object.keys(q).map(function(k){return esc(k)+' '+N(q[k])}).join(', ')+'</span>'}
 return h}
function cor(id){var c=g(id);c.cr=(c.cr||0)+1;c.u=Date.now();sv();render()}
function ohT(){return(CF.oh||[]).reduce(function(a,x){return a+(+x.a||0)},0)}
